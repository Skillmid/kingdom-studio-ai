name: Release verification

on:
  push:
    branches:
      - integration/kingdom-studio-release-stabilization
  pull_request:
    branches:
      - integration/kingdom-studio-release-stabilization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingdom-studio-release-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit, import and render-security tests
        run: npm test

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Non-routable CI-only placeholders let Next.js prerender authenticated shells
          # without exposing or depending on a real Supabase project.
          NEXT_PUBLIC_SUPABASE_URL: https://supabase-not-configured.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
          SUPABASE_URL: https://supabase-not-configured.invalid
          SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
